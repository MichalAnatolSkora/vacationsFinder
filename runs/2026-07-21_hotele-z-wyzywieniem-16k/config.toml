# Konfiguracja wyszukiwania wakacji.
# Skrypty czytają ten plik na starcie — zmień wartości, żeby zmienić parametry szukania.
# Pełny opis kluczy, dozwolonych wartości i który skrypt co czyta: CONFIG.md

[wylot]
lotnisko = "WRO"          # Wrocław; kod IATA lotniska wylotu

[daty]
od = 2026-08-17           # najwcześniejszy wylot
do = 2026-08-30           # najpóźniejszy powrót
min_nocy = 7
max_nocy = 9

[osoby]
dorosli = 3
dzieci = [4, 7, 7, 8]     # wiek każdego dziecka

[kierunki]
kraje = ["Włochy", "Hiszpania", "Malta", "Grecja", "Chorwacja"]

[nocleg]
budzet_max_pln = 16000    # budżet na sam nocleg, za cały pobyt
ocena_min = 8.0
# "kuchnia" wyjęta z wymagań — przy wliczonym wyżywieniu hotele rzadko mają
# kuchnie i oba filtry naraz zabijają wyniki; dopisz z powrotem w razie potrzeby.
# Wpisy wyżywienia działają jak "albo": half board LUB pełne LUB all inclusive.
udogodnienia = ["klimatyzacja", "sniadanie i kolacja", "pelne wyzywienie", "all inclusive"]
max_km_od_plazy = 20       # planowany wynajem auta, więc plaża może być dalej

[loty]
budzet_max_pln = 0         # 0 = bez limitu, po prostu szukamy najtańszych

# Punkty za udogodnienia "premium" — za nie jesteśmy gotowi zapłacić więcej.
# Dopasowanie po początku słowa, bez rozróżniania wielkości liter
# (np. "basen" łapie "Odkryty basen", "2 baseny"; nie łapie "Wanna lub prysznic").
# rank_lodging.py sortuje obiekty: punkty malejąco, w ramach punktów cena rosnąco.
# Tylko animacje/rozrywka dla dzieci i pokrewne
# (etykiety wg rank_lodging.py --list-udogodnienia).
# Uwaga (zweryfikowane na stronach obiektów): "Wieczorne rozrywki" u booking
# często oznacza DJ-a/karaoke/kasyno w okolicy, nie animacje dla dzieci —
# stąd niska waga. Prawdziwy sygnał animacji to "Klub dla dzieci"/"Animacje".
[scoring.udogodnienia]
animacj = 6                   # "Animacje dla dzieci" itp. (gdy pojawią się w danych)
"klub dla dzieci" = 6
"plac zabaw" = 4
"sala zabaw" = 4
"dla dzieci" = 2              # łapie m.in.: basen/książki/bramki dla dzieci
opieka = 2                    # "Opieka nad dziećmi"
"wieczorne rozrywki" = 1
"wieczory tematyczne" = 1
"gry planszowe" = 1
